name: Release

on:
  push:
    tags:
      - v*

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
          version: 'latest'

      - name: Get Version
        id: version
        run: |
          echo "VERSION=$(uv version --short)" >> $GITHUB_OUTPUT
          echo "TAG_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Check Version
        if: steps.version.outputs.VERSION != steps.version.outputs.TAG_VERSION
        run: exit 1

      - name: Build 
        run: |
          uv build

      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.TAG_NAME }}
        run: |
          NOTES_FILE=".github/release-notes/${TAG_NAME}.md"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            # Release Drafter 会预建同名草稿，直接跳过会留下未发布的草稿；
            # 这里改为更新正文并发布，保证 release 一定处于已发布状态。
            echo "Release $TAG_NAME already exists, updating and publishing"
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$TAG_NAME" \
                --title "$TAG_NAME" \
                --notes-file "$NOTES_FILE" \
                --draft=false \
                --latest
            else
              gh release edit "$TAG_NAME" \
                --title "$TAG_NAME" \
                --draft=false \
                --latest
            fi
          elif [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file "$NOTES_FILE" \
              --latest
          else
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --generate-notes \
              --latest
          fi

      - name: Upload Release Asset
        run: gh release upload --clobber ${{ steps.version.outputs.TAG_NAME }} dist/*.tar.gz dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
